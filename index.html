<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" href="image.png" type="image/png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时钟</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 50% 30%, #2a2018 0%, #140f0b 70%);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    padding: 24px;
  }

  /* ===== 时钟主体：橙黄渐变 ===== */
  .clock {
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: clamp(36px, 7vw, 60px) clamp(36px, 9vw, 84px);
    border-radius: 36px;
    background: linear-gradient(140deg,
                #FFE27A 0%,
                #FFD75E 18%,
                #FFB733 45%,
                #FF9210 72%,
                #F97316 100%);
    box-shadow:
      0 30px 70px rgba(249, 115, 22, .38),
      0 0 0 1px rgba(255, 255, 255, .35) inset;
    isolation: isolate;
    margin: 0 auto;
  }

  .clock::after {
    content: "";
    position: absolute;
    bottom: -50%;
    right: -20%;
    width: 80%;
    height: 110%;
    background: radial-gradient(circle,
                rgba(255, 90, 0, .22),
                rgba(255, 90, 0, 0) 70%);
    pointer-events: none;
    z-index: 0;
  }

  .clock > * { position: relative; z-index: 1; }

  /* ===== 时间 ===== */
  .time {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: .04em;
    font-family: "DIN Alternate", "Bahnschrift", ui-monospace,
                 "SF Mono", "Roboto Mono", Consolas, monospace;
    font-size: clamp(3rem, 13vw, 5.4rem);
    font-weight: 700;
    line-height: 1;
    color: #ffffff;
    letter-spacing: .01em;
    font-variant-numeric: tabular-nums;
    text-shadow:
      0 2px 2px rgba(160, 70, 0, .28),
      0 10px 26px rgba(140, 55, 0, .35);
  }

  .num {
    display: inline-block;
    min-width: 2ch;
    text-align: center;
  }

  .colon {
    transform: translateY(-.06em);
    animation: blink 1s steps(1, end) infinite;
  }

  @keyframes blink {
    0%, 49%   { opacity: 1; }
    50%, 100% { opacity: .3; }
  }

  .divider {
    width: min(320px, 78%);
    height: 1.5px;
    margin: clamp(18px, 3.5vw, 26px) auto clamp(14px, 3vw, 20px);
    background: linear-gradient(90deg,
                rgba(255, 255, 255, 0),
                rgba(255, 255, 255, .85),
                rgba(255, 255, 255, 0));
    border-radius: 2px;
  }

  /* ===== 日期 + 星期（初始为空，JS 填入） ===== */
  .date-row {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: clamp(10px, 2.5vw, 18px);
    color: #ffffff;
    font-size: clamp(1rem, 4.2vw, 1.35rem);
    font-weight: 500;
    letter-spacing: .06em;
    text-shadow: 0 2px 8px rgba(160, 70, 0, .3);
    min-height: 1.6em;   /* 占位高度，避免无内容时布局塌陷 */
  }

  .date-row .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255, 255, 255, .85);
    flex: 0 0 auto;
  }

  .week {
    font-weight: 600;
    padding: 3px 14px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .22);
    border: 1px solid rgba(255, 255, 255, .45);
    backdrop-filter: blur(2px);
    letter-spacing: .1em;
  }

  @media (max-width: 380px) {
    .date-row .dot { display: none; }
  }

  /* ===== 无 JS 时的全屏提示 ===== */
  .noscript-mask {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(15, 10, 6, .92);
    backdrop-filter: blur(6px);
    color: #fff;
    text-align: center;
  }

  .noscript-box {
    max-width: 420px;
    padding: 32px 28px;
    border-radius: 22px;
    background: linear-gradient(140deg, #FFD75E, #F97316);
    box-shadow: 0 20px 50px rgba(249, 115, 22, .45);
  }

  .noscript-box h2 {
    font-size: 1.35rem;
    margin-bottom: 12px;
    letter-spacing: .05em;
  }

  .noscript-box p {
    font-size: .95rem;
    line-height: 1.7;
    opacity: .95;
  }
</style>
</head>
<body>

  <!-- ============ 无 JS 时的兜底提示 ============ -->
  <noscript>
    <div class="noscript-mask">
      <div class="noscript-box">
        <h2>⏰ 时钟无法显示</h2>
        <p>
          检测到你的浏览器<strong>未开启 JavaScript</strong>，
          或脚本加载失败／网络异常。<br>
          请开启 JavaScript 后刷新页面。
        </p>
      </div>
    </div>
  </noscript>

  <!-- ============ 时钟主体 ============ -->
  <div class="clock">
    <div class="time">
      <span class="num" id="h">00</span>
      <span class="colon">:</span>
      <span class="num" id="m">00</span>
      <span class="colon">:</span>
      <span class="num" id="s">00</span>
    </div>

    <div class="divider"></div>

    <!-- 日期和星期初始为空，由 JS 填入真实时间 -->
    <div class="date-row">
      <span id="date"></span>
      <span class="dot"></span>
      <span class="week" id="week"></span>
    </div>
  </div>

<script>
  const hEl    = document.getElementById('h');
  const mEl    = document.getElementById('m');
  const sEl    = document.getElementById('s');
  const dateEl = document.getElementById('date');
  const weekEl = document.getElementById('week');

  const WEEK = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
  const pad  = n => String(n).padStart(2, '0');

  function tick() {
    const now = new Date();

    hEl.textContent = pad(now.getHours());
    mEl.textContent = pad(now.getMinutes());
    sEl.textContent = pad(now.getSeconds());

    dateEl.textContent =
      `${now.getFullYear()}年${pad(now.getMonth() + 1)}月${pad(now.getDate())}日`;

    weekEl.textContent = WEEK[now.getDay()];
  }

  tick();
  setInterval(tick, 1000);
</script>

</body>
</html>
